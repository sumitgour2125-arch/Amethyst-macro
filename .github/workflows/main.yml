
name: Build Minecraft Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source
        run: unzip -o AmethystSmartMiner-source.zip -d source

      - name: Build mod
        run: |
          F=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$F" ]; then
            echo "Settings file not found"
            find source -maxdepth 5 -type f
            exit 1
          fi
          DIR=$(dirname "$F")
          cd "$DIR"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AmethystSmartMiner-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          
